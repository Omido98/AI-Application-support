name: PR verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Version consistency
        run: npm run version:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Prompt eval harness
        run: npm run eval

      - name: Production build
        run: npm run build

  rust:
    name: Rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux build links against gtk/webkit2gtk; the runner image does
      # not ship them. libdbus is the Secret Service client used by keyring.
      - name: Tauri Linux prerequisites
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            patchelf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  native-e2e:
    name: Native e2e (${{ matrix.name }})
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tauri Linux prerequisites and WebDriver
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            webkit2gtk-driver xvfb dbus dbus-x11 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            patchelf
          # Ubuntu 24.04 blocks the WebKit WebProcess sandbox (bwrap) by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install matching msedgedriver
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $ver = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if (-not $ver) {
            $ver = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          }
          Write-Host "WebView2 runtime: $ver"
          $url = "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          # The CDN occasionally drops a large download; resume until it is complete.
          for ($attempt = 0; $attempt -lt 5; $attempt++) {
            curl.exe -L --fail --retry 3 --retry-all-errors -C - $url -o $zip
            if ($LASTEXITCODE -eq 0) { break }
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not download $url" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'edgedriver') -Force
          "$env:RUNNER_TEMP\edgedriver" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" --version

      - name: Install gsudo (Medium-integrity test run)
        if: matrix.platform == 'windows-latest'
        run: >
          winget install --id gerardog.gsudo --exact --version 2.6.1
          --source winget --installer-type wix --silent
          --accept-package-agreements --accept-source-agreements

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache tauri-driver
        id: cache-tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver*
          key: tauri-driver-${{ runner.os }}-2.1.0

      - name: Install tauri-driver
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: Build isolated debug app
        run: npm run build:e2e
        timeout-minutes: 25

      - name: Run native e2e (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: >
          & "$env:ProgramFiles\gsudo\Current\gsudo.exe"
          --direct --integrity Medium npm run test:e2e:native
        timeout-minutes: 10

      - name: Run native e2e (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: >
          xvfb-run -a -s "-screen 0 1280x1024x24"
          dbus-run-session -- npm run test:e2e:native
        timeout-minutes: 10

      - name: Upload native e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-${{ matrix.name }}
          path: tests/e2e-native/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Playwright (browser mode)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Accessibility checks (WCAG 2.2 AA)
        run: npm run test:a11y

      - name: Performance checks
        run: npm run test:perf
        continue-on-error: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
