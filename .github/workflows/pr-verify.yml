name: PR verification

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Tauri 2's Linux build (gtk/webkit2gtk) needs system development
      # libraries; the runner image does not ship them. Without this the
      # cargo steps fail before any test runs. `libdbus-1-dev` is the Secret
      # Service client the keyring crate links on Linux — dropping the
      # `sync-secret-service` feature must fail here, not at release time.
      - name: Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            patchelf

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Rust check
        working-directory: src-tauri
        run: cargo check